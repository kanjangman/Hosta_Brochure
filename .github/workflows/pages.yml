name: Deploy brochure to GitHub Pages

on:
  push:
    branches: ["claude/hosta-brochure-research-tp5nrd"]
  workflow_dispatch:

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate data against schema & (re)build hostas.data.js
        run: |
          python -m pip install --quiet jsonschema
          python scripts/gen_data.py

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r template assets data _site/

      - name: Configure Pages (auto-enable now that repo is public)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
