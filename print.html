<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>출력 · 목향농원 호스타</title>
  <link rel="icon" href="assets/placeholder.svg">
  <style>
    /* ============================================================
       고객 배부용 카드 — 잡지/브로셔 스타일 (좌측 히어로 사진형)
       PDF 페이지 = 카드 실물 크기 210 x 148.5mm (A5 가로).
       A4 세로 용지에 "한 면에 2페이지(2-up)"로 뽑으면 비율이 같아
       축소 없이 100% 실물 크기 두 장이 나온다.
       ============================================================ */
    @page { size: 210mm 148.5mm; margin: 0; }
    :root{
      --green-900:#1f2d19;--green-800:#33472a;--green-700:#456138;--green-600:#5f8a52;
      --green-300:#a9c79a;--green-100:#eaf1e4;--gold:#b8912e;--gold-soft:#f3e6bf;
      --ink:#26281f;--muted:#77806f;--line:#dfe6d8;--paper:#fdfdfb;
      --serif:'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',Batang,'Times New Roman',serif;
      --sans:system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;}
    body{ font-family:var(--sans); color:var(--ink); background:#e3e8de; }

    .toolbar{ max-width:210mm; margin:0 auto; padding:10px 4px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .toolbar button{ border:0; background:var(--green-700); color:#fff; padding:8px 16px; border-radius:8px; font:inherit; font-weight:700; cursor:pointer; }
    .toolbar .hint{ color:#5d665a; font-size:12.5px; line-height:1.5; }

    /* ---- 카드(=PDF 1페이지, 실물 210x148.5mm) ---- */
    .sheet{
      width:210mm; height:148.5mm; margin:0 auto; background:var(--paper); overflow:hidden;
      display:grid; grid-template-columns:88mm 1fr; position:relative;
    }

    /* 좌: full-bleed 히어로 사진 */
    .hero{ position:relative; overflow:hidden; background:var(--green-100); }
    .hero img{ width:100%; height:100%; object-fit:cover; display:block; }
    .hero .shade{ position:absolute; inset:auto 0 0 0; height:38mm;
      background:linear-gradient(transparent,rgba(20,28,16,.62)); }
    .hero .kicker-img{ position:absolute; left:7mm; right:6mm; bottom:6mm; color:#fff; }
    .hero .kicker-img .genus{ font-size:7.5pt; letter-spacing:.28em; text-transform:uppercase; opacity:.85; margin-bottom:1mm; }
    .hero .kicker-img .sci{ font-family:var(--serif); font-style:italic; font-size:12pt; }
    .hero .credit{ position:absolute; right:2.5mm; top:2.5mm; font-size:6.2pt; color:#fff; background:rgba(20,28,16,.42);
      padding:.6mm 1.6mm; border-radius:2px; max-width:70%; text-align:right; }

    /* 우: 편집 텍스트 컬럼 */
    .editorial{ padding:11mm 12mm 8.5mm 11mm; display:flex; flex-direction:column; min-width:0; }
    .kicker{ font-size:8pt; font-weight:800; letter-spacing:.3em; color:var(--gold); text-transform:uppercase; margin:0 0 3.5mm; }
    .kicker .rule{ display:inline-block; width:9mm; height:1.4px; background:var(--gold); vertical-align:middle; margin-right:2.5mm; }
    h1.title{ font-family:var(--serif); font-weight:800; font-size:27pt; line-height:1.05; letter-spacing:-.01em;
      color:var(--green-900); margin:0 0 1.5mm; }
    .title-en{ font-size:10pt; color:var(--muted); letter-spacing:.14em; text-transform:uppercase; margin:0 0 3.5mm; }

    .awards{ display:flex; flex-wrap:wrap; gap:1.6mm 2.4mm; margin:0 0 3.5mm; }
    .awards span{ font-size:7.6pt; font-weight:700; color:#83641a; background:var(--gold-soft);
      padding:.9mm 2.6mm; border-radius:999px; white-space:nowrap; }

    .lead{ font-family:var(--serif); font-size:13pt; line-height:1.45; color:var(--green-700); margin:0 0 3.5mm; }
    .lead::before{ content:"“"; color:var(--gold); } .lead::after{ content:"”"; color:var(--gold); }

    .para{ font-size:9.3pt; line-height:1.7; color:#3a3d33; margin:0; text-align:justify; }
    .para::first-letter{ font-family:var(--serif); font-size:21pt; font-weight:800; color:var(--green-800);
      float:left; line-height:.9; padding:1px 4px 0 0; }
    .rec{ font-size:8.6pt; font-style:italic; color:var(--muted); margin:2.6mm 0 0; }

    /* 데이터 스트립 (at a glance) */
    .glance{ margin-top:auto; border-top:1.6px solid var(--green-900); padding-top:2.8mm; }
    .glance .gl-title{ font-size:7pt; font-weight:800; letter-spacing:.26em; color:var(--green-800); text-transform:uppercase; margin:0 0 2mm; }
    .glance .grid{ display:flex; flex-wrap:wrap; gap:1.8mm 5mm; font-size:8.4pt; line-height:1.35; }
    .glance .item{ display:flex; gap:1.8mm; align-items:baseline; }
    .glance .k{ color:var(--gold); font-weight:800; white-space:nowrap; font-size:7.6pt; letter-spacing:.05em; }
    .glance .k::before{ content:"◆ "; font-size:5.5pt; vertical-align:1px; }
    .glance .v{ color:var(--ink); }

    .foot{ display:flex; justify-content:space-between; align-items:baseline; margin-top:2.8mm; padding-top:1.8mm; border-top:1px solid var(--line); }
    .foot .brand{ font-size:7.5pt; letter-spacing:.22em; color:var(--green-700); font-weight:800; text-transform:uppercase; }
    .foot .place{ font-size:7.5pt; color:var(--muted); }

    .empty{ padding:20mm; text-align:center; color:var(--muted); grid-column:1/-1; align-self:center; }

    @media screen{ body{ padding:6mm 0 14mm; } .sheet{ box-shadow:0 8px 30px rgba(31,45,25,.22); } }
    @media print{ body{ background:#fff; padding:0; } .toolbar{ display:none; } .sheet{ box-shadow:none; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">🖨 인쇄 / PDF 저장</button>
    <span class="hint">PDF 1페이지 = 카드 <b>실물 크기 210×148.5mm(A5 가로)</b> · A4 세로 용지에 <b>“한 면에 2페이지”</b>로 출력하면 축소 없이 실물 크기 2장이 나옵니다 (여백 ‘없음’·배경 그래픽 ‘켬’·배율 100%)</span>
  </div>
  <main class="sheet" id="sheet"><div class="empty">불러오는 중…</div></main>

  <script src="data/hostas.data.js"></script>
  <script>
  (function(){
    "use strict";
    var SIZE={mini:"미니",small:"소형",medium:"중형",large:"대형",giant:"초대형"};
    var RATE={slow:"느긋함",medium:"보통",fast:"빠름"};
    var RESIST={low:"낮음",medium:"보통",high:"강함"};
    var BLOOM={"early":"초여름","early-mid":"초·중간","mid":"한여름","mid-late":"중·늦여름","late":"늦여름"};

    function el(t,a,txt){var n=document.createElement(t);if(a)for(var k in a){if(a[k]!=null)n.setAttribute(k,a[k]);}if(txt!=null)n.textContent=txt;return n;}
    function range(arr,u){if(!arr||arr.length!==2||arr[0]==null)return null;return arr[0]===arr[1]?arr[0]+u:arr[0]+"–"+arr[1]+u;}

    function loadData(){
      if(window.HOSTA_DATA) return Promise.resolve(window.HOSTA_DATA);
      return fetch("data/hostas.json").then(function(r){return r.json();});
    }

    function render(h){
      var sheet=document.getElementById("sheet");
      sheet.innerHTML="";
      document.title="출력 · "+h.name_ko+" "+h.name_en;

      /* ---- 좌: 히어로 사진 ---- */
      var hero=el("div",{class:"hero"});
      var src=(h.images&&h.images.farm_photo&&h.images.farm_photo.src) || (h.images&&h.images.reference_image&&h.images.reference_image.url) || (h.images&&h.images.farm_photo&&h.images.farm_photo.placeholder) || "assets/placeholder.svg";
      var ph=(h.images&&h.images.farm_photo&&h.images.farm_photo.placeholder)||"assets/placeholder.svg";
      var img=el("img",{src:src,alt:h.name_ko});
      hero.appendChild(img);
      hero.appendChild(el("div",{class:"shade"}));
      var ki=el("div",{class:"kicker-img"});
      ki.appendChild(el("div",{class:"genus"},"Mokhyang Hosta Collection"));
      if(h.cultivar) ki.appendChild(el("div",{class:"sci"},h.cultivar));
      hero.appendChild(ki);
      var ref=h.images&&h.images.reference_image, cap=null;
      if(src && ref && ref.url && src===ref.url && ref.credit){ cap=el("div",{class:"credit"},ref.credit+(ref.license?" · "+ref.license:"")); hero.appendChild(cap); }
      img.onerror=function(){ if(img.src.indexOf("placeholder")<0){img.src=ph;} if(cap)cap.style.display="none"; };
      sheet.appendChild(hero);

      /* ---- 우: 편집 컬럼 ---- */
      var ed=el("div",{class:"editorial"});

      var kickerBits=[];
      if(h.size&&h.size.class) kickerBits.push(SIZE[h.size.class]+" HOSTA");
      if(h.flower&&h.flower.fragrant) kickerBits.push("FRAGRANT");
      var kick=el("p",{class:"kicker"});
      kick.appendChild(el("span",{class:"rule"}));
      kick.appendChild(document.createTextNode(kickerBits.join(" · ")||"HOSTA"));
      ed.appendChild(kick);

      ed.appendChild(el("h1",{class:"title"},h.name_ko));
      ed.appendChild(el("p",{class:"title-en"},h.name_en));

      var aw=el("div",{class:"awards"}); var hasAw=false;
      (h.awards||[]).forEach(function(a){
        if(/hosta of the year|올해의\s*호스타/i.test(a)){var y=(a.match(/(19|20)\d\d/)||[])[0]||"";aw.appendChild(el("span",null,"🏆 올해의 호스타 "+y));hasAw=true;}
        else if(/garden merit|\bagm\b/i.test(a)){aw.appendChild(el("span",null,"🏆 RHS 정원공로상"));hasAw=true;}
      });
      if(hasAw) ed.appendChild(aw);

      var rc=h.retail_copy&&h.retail_copy.warm;
      if(rc&&rc.headline_ko) ed.appendChild(el("p",{class:"lead"},rc.headline_ko));
      if(h.description_ko) ed.appendChild(el("p",{class:"para"},h.description_ko));
      else if(rc&&rc.body_ko) ed.appendChild(el("p",{class:"para"},rc.body_ko));
      if(rc&&rc.recommend_for_ko) ed.appendChild(el("p",{class:"rec"},"— 이런 분께: "+rc.recommend_for_ko));

      /* at a glance 데이터 스트립 */
      var gl=el("div",{class:"glance"});
      gl.appendChild(el("p",{class:"gl-title"},"At a Glance · 한눈에 보기"));
      var grid=el("div",{class:"grid"});
      function item(label,val){ if(val==null||val==="")return;
        var w=el("div",{class:"item"}); w.appendChild(el("span",{class:"k"},label)); w.appendChild(el("span",{class:"v"},val)); grid.appendChild(w); }
      var sz=null;
      if(h.size){var hh=range(h.size.height_cm,"cm"),sp=range(h.size.spread_cm,"cm"); if(hh||sp) sz=(hh?"높이 "+hh:"")+(hh&&sp?" · ":"")+(sp?"폭 "+sp:"");}
      item("크기",sz);
      var lt=h.culture&&h.culture.light_ko; if(lt) lt=lt.split(/[.\n]/)[0].trim();
      item("광량",lt);
      if(h.flower){var b=h.flower.bloom_season; var fk=[h.flower.color_ko,b?BLOOM[b]+" 개화":null].filter(Boolean).join(" · "); item("꽃",fk||null);}
      if(h.flower&&h.flower.fragrant) item("향기","있음");
      item("내한성", h.culture&&h.culture.hardiness);
      item("성장", h.culture&&h.culture.growth_rate?RATE[h.culture.growth_rate]:null);
      item("민달팽이", h.culture&&h.culture.slug_resistance?RESIST[h.culture.slug_resistance]:null);
      gl.appendChild(grid);
      ed.appendChild(gl);

      var foot=el("div",{class:"foot"});
      foot.appendChild(el("span",{class:"brand"},"목향농원 Mokhyang Nursery"));
      foot.appendChild(el("span",{class:"place"},"경기 용인 처인구 남사"));
      ed.appendChild(foot);

      sheet.appendChild(ed);
    }

    loadData().then(function(data){
      var arr=Array.isArray(data)?data:(data.hostas||[]);
      function show(id){ var h=null; for(var i=0;i<arr.length;i++) if(arr[i].id===id){h=arr[i];break;} if(!h)h=arr[0]; if(h)render(h); }
      show((location.hash||"").replace("#","")||(arr[0]&&arr[0].id));
      window.addEventListener("hashchange",function(){ show((location.hash||"").replace("#","")); });
    }).catch(function(e){
      document.getElementById("sheet").innerHTML='<div class="empty">데이터를 불러오지 못했습니다. 로컬 서버로 열거나 data/hostas.data.js를 확인하세요.</div>';
    });
  })();
  </script>
</body>
</html>
